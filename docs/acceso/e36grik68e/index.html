<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tvoj pristup</title>
<style>
  html, body { margin:0; background:#FAF7F2; color:#2B2522; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:64px 20px; text-align:center; }
  .badge { display:inline-block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; background:#EFE6DA; padding:6px 12px; border-radius:99px; }
  h1 { font-size:28px; line-height:1.2; margin:18px 0 10px; }
  p { font-size:17px; line-height:1.55; color:#5B514B; }
  .card { background:#fff; border:1px solid #EAE0D5; border-radius:16px; padding:24px 20px; margin-top:28px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#1F9D55; margin-right:8px; animation:p 1.6s infinite; }
  @keyframes p { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Kupovina potvrđena</span>
    <h1>Priručnik za Art Terapiju</h1>
    <p>Hvala! Upravo završavamo pripreme tvog materijala. Ova ista stranica će se ažurirati sa svim tvojim datotekama.</p>
    <div class="card">
      <p><span class="dot"></span><strong>Sačuvaj ovaj link</strong></p>
      <p>Ovo je tvoj doživotni pristup. Vrati se za nekoliko sati i pronaći ćeš glavni priručnik i sve bonuse.</p>
    </div>
  </div>
</body>
</html>
